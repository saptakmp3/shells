<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Shell Drill · ii–V–I</title>
<style>
:root{--bg:#000;--s1:#0b0b0f;--s2:#14141b;--s3:#1f1f2a;--tx:#f3f4f8;--mute:#80849a;
--green:#22d36b;--red:#ff4d5e;--amber:#ffb020;--blue:#3b9cff;--purple:#a66bff;--pink:#ff5fa2;--cyan:#20d5e6;
--kbh:clamp(118px,37vh,250px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;cursor:pointer;border:0;color:inherit}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* header */
header{flex:none;height:46px;display:flex;align-items:center;gap:7px;padding:0 10px}
.logo{font-weight:900;font-size:15px;letter-spacing:.06em;white-space:nowrap}
.logo span{color:var(--cyan)}
.grow{flex:1}
.seg{display:flex;gap:4px;background:var(--s2);padding:3px;border-radius:12px}
.seg button{background:transparent;color:var(--mute);font-weight:800;font-size:12px;letter-spacing:.05em;padding:0 11px;height:30px;border-radius:9px}
.seg button.on[data-mode=play]{background:var(--green);color:#000}
.seg button.on[data-mode=recall]{background:var(--purple);color:#000}
.seg button.on[data-mode=learn]{background:var(--cyan);color:#000}
.seg.dis{opacity:.45;pointer-events:none}
.st{font-weight:800;font-size:13px;padding:5px 9px;border-radius:9px;background:var(--s2);white-space:nowrap}
.st.g{color:var(--green)}.st.r{color:var(--red)}.st.a{color:var(--amber)}
.clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;min-width:54px;text-align:center;color:var(--cyan);background:var(--s2);padding:5px 8px;border-radius:9px;white-space:nowrap}
.clock.warn{color:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{to{background:#3a0f16}}
.ib{height:32px;min-width:34px;padding:0 10px;border-radius:10px;background:var(--s3);font-weight:800;font-size:12px}
.ib.on{background:var(--cyan);color:#000}
.ib:disabled{opacity:.35;pointer-events:none}
#bMic.on{background:linear-gradient(90deg,var(--cyan) var(--lv,0%),var(--s3) var(--lv,0%));color:#fff}
.heard{display:none;font-weight:800;font-size:12px;color:var(--cyan);background:var(--s2);padding:5px 8px;border-radius:9px;min-width:74px;text-align:center;white-space:nowrap}

/* buttons */
.btn{--c:var(--blue);background:var(--c);color:#000;font-weight:900;letter-spacing:.04em;border-radius:14px;padding:0 12px;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.55);transition:transform .08s,filter .08s}
.btn:active{transform:translateY(2px) scale(.97);filter:brightness(1.25)}
.btn:disabled{opacity:.28;pointer-events:none}
.green{--c:var(--green)}.red{--c:var(--red)}.amber{--c:var(--amber)}.blue{--c:var(--blue)}.purple{--c:var(--purple)}.pink{--c:var(--pink)}.cyan{--c:var(--cyan)}
.btn.big{height:56px;font-size:20px;padding:0 34px;border-radius:18px}
.btn.sm{height:32px}

/* stage */
#stage{flex:1;min-height:0;position:relative;display:grid;grid-template-columns:minmax(104px,160px) 1fr minmax(92px,122px);gap:10px;padding:6px 10px 8px}
#tbar{position:absolute;left:10px;right:10px;top:0;height:5px;border-radius:3px;background:var(--s2);display:none;overflow:hidden}
#tbar i{display:block;height:100%;width:100%;background:var(--green);transition:background .2s}
#left{display:flex;flex-direction:column;justify-content:center;gap:5px;min-width:0}
#keyLbl{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--mute)}
#keyBig{font-size:clamp(40px,14vh,80px);font-weight:900;line-height:.95;color:#fff;white-space:nowrap}
#badges{display:flex;flex-wrap:wrap;gap:4px}
.bdg{font-size:10px;font-weight:900;letter-spacing:.06em;padding:3px 7px;border-radius:8px;color:#000;background:var(--c,var(--blue));white-space:nowrap}
.bdg.blue{--c:var(--blue)}.bdg.pink{--c:var(--pink)}.bdg.purple{--c:var(--purple)}.bdg.green{--c:var(--green)}.bdg.amber{--c:var(--amber)}.bdg.cyan{--c:var(--cyan)}
#prog{font-size:11px;color:var(--mute);font-weight:700}
#center{display:flex;flex-direction:column;min-width:0;min-height:0}
#tiles{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px}
#msg{height:24px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msg.good{color:var(--green)}#msg.bad{color:var(--red)}
#side{display:flex;flex-direction:column;gap:7px}
#side .btn{flex:1;min-height:0;font-size:13px}

.tile{--c:#3b9cff;--cd:#3b9cff55;border:2px solid var(--cd);background:linear-gradient(#10101a,#08080c);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:5px 4px;min-width:0;transition:transform .15s,box-shadow .15s,border-color .15s}
.tile.ii{--c:#3b9cff;--cd:#3b9cff55}.tile.v{--c:#ffb020;--cd:#ffb02055}.tile.i{--c:#22d36b;--cd:#22d36b55}.tile.iii{--c:#a66bff;--cd:#a66bff55}.tile.vi{--c:#ff5fa2;--cd:#ff5fa255}
.tile.act{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 24px var(--cd);transform:translateY(-2px)}
.tile.done{border-color:var(--c);opacity:.95}
.tile:not(.act):not(.done){opacity:.62}
.tile.bad{animation:shake .35s;border-color:var(--red);box-shadow:0 0 22px #ff4d5e88}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.role{font-size:11px;font-weight:900;letter-spacing:.1em;background:var(--c);color:#000;padding:2px 10px;border-radius:8px}
.chord{font-size:clamp(13px,min(5.8vh,calc(15vw/var(--n,3))),36px);font-weight:900;color:#fff;white-space:nowrap}
.slots{display:flex;gap:5px;width:100%;justify-content:center;padding:0 5px}
.slot{position:relative;flex:0 1 clamp(24px,min(9.5vh,calc(11vw/var(--n,3))),56px);height:clamp(24px,min(9.5vh,calc(11vw/var(--n,3))),56px);min-width:0;border-radius:11px;background:#1b1b25;display:grid;place-items:center;font-weight:900}
.slot b{font-size:clamp(12px,min(4.2vh,calc(5vw/var(--n,3))),26px)}
.slot small{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:9px;font-weight:800;color:var(--mute)}
.slot.ok{background:var(--c);color:#000}
.slot.rev{background:transparent;border:2px solid var(--c);color:var(--c)}
.slot.na{opacity:.25}
.vl{height:13px;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--mute);white-space:nowrap}

/* idle overlay */
#idle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.88);z-index:5}
.idle-card{display:flex;align-items:center;gap:22px;padding:0 20px}
.idle-t{font-size:clamp(20px,6vh,32px);font-weight:900;letter-spacing:.04em}
.idle-t span{color:var(--cyan)}
#idleSum{margin-top:5px;font-size:13px;font-weight:700;color:var(--mute);max-width:46ch;line-height:1.35}
#idleBest{margin-top:3px;font-size:12px;font-weight:800;color:var(--amber)}

/* keyboard */
#kb{position:relative;flex:none;height:var(--kbh);margin:0 6px 6px;border-radius:10px;overflow:hidden;background:#000;display:flex;touch-action:none}
.k{touch-action:none}
.wk{position:relative;flex:1;background:linear-gradient(#f6f6f9,#d6d6de);box-shadow:inset -1px 0 0 rgba(0,0,0,.55),inset 0 -4px 0 rgba(0,0,0,.12);border-radius:0 0 6px 6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;color:#666;font-size:10px;font-weight:800}
.bk{position:absolute;top:0;height:60%;transform:translateX(-50%);background:linear-gradient(#3a3a45,#050507);border-radius:0 0 6px 6px;z-index:2;box-shadow:0 3px 4px rgba(0,0,0,.7)}
.wk.down{background:linear-gradient(#d4eaff,#98ccff)}
.bk.down{background:linear-gradient(#59adff,#1b62b8)}
.wk.ans{background:linear-gradient(#ffe9ae,#ffb020)}
.bk.ans{background:linear-gradient(#ffc84d,#c47f00)}
.wk.good{background:linear-gradient(#bfffd9,#3fe08a)}
.bk.good{background:linear-gradient(#3fe08a,#0e8a45)}
.wk.bad{background:linear-gradient(#ffc0c6,#ff4d5e)}
.bk.bad{background:linear-gradient(#ff6b79,#a3182a)}

/* settings */
#sheet{position:fixed;inset:0;background:#050507;z-index:30;display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#sheet.open{display:flex}
.sh-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;font-weight:900;letter-spacing:.08em}
.sh-main{flex:1;min-height:0;display:flex}
.rail{width:124px;flex:none;display:flex;flex-direction:column;gap:7px;padding:2px 8px 10px 12px;overflow:auto}
.tab{--c:var(--cyan);height:40px;flex:none;border-radius:12px;background:var(--s2);color:var(--c);font-weight:900;font-size:12px;letter-spacing:.06em}
.tab.on{background:var(--c);color:#000}
#sbody{flex:1;overflow:auto;padding:0 16px 28px 6px;-webkit-overflow-scrolling:touch}
.pres{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.pre{--c:var(--green);text-align:left;background:var(--s2);border-left:6px solid var(--c);border-radius:12px;padding:10px 12px;color:var(--tx)}
.pre:active{filter:brightness(1.4)}
.pre b{display:block;font-size:14px;color:var(--c);letter-spacing:.05em}
.pre span{font-size:12px;color:var(--mute);font-weight:700;line-height:1.3;display:block;margin-top:2px}
.grp{--gc:var(--cyan);margin:0 0 15px}
.grp h4{margin:0 0 7px;font-size:11px;letter-spacing:.14em;color:var(--gc);font-weight:900;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:2px solid var(--gc);color:var(--gc);background:transparent;border-radius:12px;padding:0 13px;height:38px;font-weight:800;font-size:14px}
.chip.on{background:var(--gc);color:#000}
.chip:active{transform:scale(.95)}
.note{font-size:12px;color:var(--mute);margin:7px 0 0;line-height:1.45;font-weight:600}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-bottom:12px}
.hc{border-radius:9px;padding:6px 1px;text-align:center;font-weight:900;font-size:13px}
.hc small{display:block;font-size:9px;font-weight:800}

/* results */
#res{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:40}
#res.open{display:flex}
.rcard{background:#0b0b10;border:2px solid var(--s3);border-radius:20px;padding:14px 18px;max-width:min(720px,94vw);max-height:94vh;overflow:auto}
.rcard h2{margin:0 0 8px;font-size:20px;font-weight:900;letter-spacing:.05em}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rs{background:var(--s2);border-radius:12px;padding:8px 10px;text-align:center}
.rs b{display:block;font-size:clamp(18px,5vh,28px);font-weight:900}
.rs span{font-size:10px;letter-spacing:.1em;color:var(--mute);font-weight:800}
.weak{margin-top:10px;font-size:12px;color:var(--mute);font-weight:700;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.weak .bdg{--c:var(--red)}
.ract{display:flex;gap:10px;margin-top:12px;justify-content:center}
.ract .btn{height:44px;min-width:110px}
.nb{color:var(--amber);font-weight:900;font-size:13px;letter-spacing:.1em;margin-bottom:6px}

#toast{position:fixed;left:50%;bottom:calc(var(--kbh) + 24px);transform:translateX(-50%);background:var(--s3);padding:8px 14px;border-radius:12px;font-weight:800;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:1}

/* portrait lock */
#rot{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
#rot .ph{width:46px;height:78px;border:4px solid var(--cyan);border-radius:10px;animation:rot 1.8s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rot b{font-size:20px;letter-spacing:.06em}
#rot span{color:var(--mute);font-size:13px;font-weight:700}
@media (orientation:portrait){#rot{display:flex}}
@media (max-width:760px){.logo{display:none}.st{padding:4px 7px;font-size:12px}.pres{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">SHELLS <span>ii·V·I</span></div>
    <div class="seg" id="modeSeg">
      <button data-mode="play">PLAY</button>
      <button data-mode="recall">RECALL</button>
      <button data-mode="learn">LEARN</button>
    </div>
    <div class="grow"></div>
    <div class="st g" id="sOk">✓ 0</div>
    <div class="st r" id="sBad">✗ 0</div>
    <div class="st a" id="sStr">🔥 0</div>
    <div class="clock" id="clock">0:00</div>
    <div class="heard" id="heard"></div>
    <button class="ib" id="bMic">🎤</button>
    <button class="ib" id="bMidi">MIDI</button>
    <button class="ib" id="bGear">⚙</button>
  </header>

  <section id="stage">
    <div id="tbar"><i></i></div>
    <div id="left">
      <div id="keyLbl">KEY OF</div>
      <div id="keyBig">–</div>
      <div id="badges"></div>
      <div id="prog"></div>
    </div>
    <div id="center">
      <div id="tiles"></div>
      <div id="msg"></div>
    </div>
    <div id="side">
      <button class="btn cyan" id="bHear" data-nofx>▶ HEAR</button>
      <button class="btn purple" id="bShow" data-nofx>👁 SHOW</button>
      <button class="btn amber" id="bSkip" data-nofx>⏭ SKIP</button>
      <button class="btn red" id="bStop" data-nofx>■ STOP</button>
    </div>
    <div id="idle">
      <div class="idle-card">
        <div>
          <div class="idle-t">ii–V–I <span>SHELLS</span></div>
          <div id="idleSum"></div>
          <div id="idleBest"></div>
        </div>
        <button class="btn green big" id="bStart" data-nofx>▶ START</button>
      </div>
    </div>
  </section>

  <div id="kb"></div>
</div>

<aside id="sheet">
  <div class="sh-head"><span>SETTINGS</span><button class="btn blue sm" id="bClose" data-nofx>DONE</button></div>
  <div class="sh-main"><div class="rail" id="rail"></div><div id="sbody"></div></div>
</aside>

<div id="res"><div class="rcard" id="rcard"></div></div>
<div id="toast"></div>
<div id="rot"><div class="ph"></div><b>ROTATE TO LANDSCAPE</b><span>The keyboard needs the width</span></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const LO=48,HI=83;

/*PURE-START*/
/* ---------- theory ---------- */
const LET=['C','D','E','F','G','A','B'],NAT=[0,2,4,5,7,9,11];
const NAMES={
 maj:['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'],
 min:['C','C♯','D','E♭','E','F','F♯','G','G♯','A','B♭','B']
};
const keyLetter=(ton,pc)=>LET.indexOf(NAMES[ton][pc][0]);
const ACC=d=>d===0?'':d===1?'♯':d===-1?'♭':d===2?'×':'♭♭';
const spell=(li,pc)=>{let d=(pc-NAT[li]+12)%12;if(d>6)d-=12;return LET[li]+ACC(d);};
/* s = semitones above chord root, l = letter steps, n = degree number (for sorting) */
const DEG={
 b3:{s:3,l:2,n:3,t:'♭3'},t3:{s:4,l:2,n:3,t:'3'},b5:{s:6,l:4,n:5,t:'♭5'},
 b7:{s:10,l:6,n:7,t:'♭7'},t7:{s:11,l:6,n:7,t:'7'},s6:{s:9,l:5,n:6,t:'6'},
 p5:{s:7,l:4,n:5,t:'5'},n9:{s:2,l:1,n:9,t:'9'},f9:{s:1,l:1,n:9,t:'♭9'},t13:{s:9,l:5,n:13,t:'13'}
};
/* A = voicing low→high. B = A rotated left by one (lowest note goes to the top). */
const REC={
 maj:{
  ii:{sh:{A:['b3','b7'],sym:'m7'},co:{A:['b3','b7','n9'],sym:'m9',B:['b7','b3','p5'],symB:'m7'}},
  V:{sh:{A:['b7','t3'],sym:'7'},co:{A:['b7','t3','t13'],sym:'13',B:['t3','b7','n9'],symB:'9'}},
  I:{
   maj:{sh:{A:['t3','t7'],sym:'maj7'},co:{A:['t3','t7','n9'],sym:'maj9',B:['t7','t3','p5'],symB:'maj7'}},
   six:{sh:{A:['t3','s6'],sym:'6'},co:{A:['t3','s6','n9'],sym:'6/9',B:['s6','t3','p5'],symB:'6'}},
   sixnine:{sh:{A:['n9','s6'],sym:'6/9'},co:{A:['t3','s6','n9'],sym:'6/9',B:['s6','n9','t3'],symB:'6/9'}}
  }},
 min:{
  ii:{sh:{A:['b3','b5','b7'],sym:'ø7'},co:{A:['b3','b5','b7'],sym:'ø7'}},
  V:{sh:{A:['b7','t3'],sym:'7'},co:{A:['b7','f9','t3'],sym:'7♭9'}},
  I:{
   m7:{sh:{A:['b3','b7'],sym:'m7'},co:{A:['b3','b7','n9'],sym:'m9',B:['b7','b3','p5'],symB:'m7'}},
   m6:{sh:{A:['b3','s6'],sym:'m6'},co:{A:['b3','s6','n9'],sym:'m6/9',B:['s6','b3','p5'],symB:'m6'}},
   mmaj:{sh:{A:['b3','t7'],sym:'m(maj7)'},co:{A:['b3','t7','n9'],sym:'m(maj9)',B:['t7','b3','p5'],symB:'m(maj7)'}}
  }}
};
/* iii behaves like a ii (m7), VI like a V (dominant), so the same recipes and the same A/B logic chain through the cycle of fifths */
const ROLEDEF={
 iii:{cls:'iii',off:2,semi:4,like:'ii'},VI:{cls:'vi',off:5,semi:9,like:'V'},
 ii:{cls:'ii',off:1,semi:2,like:'ii'},V:{cls:'v',off:4,semi:7,like:'V'},I:{cls:'i',off:0,semi:0,like:'I'}
};
const PROGS={iiVI:['ii','V','I'],iiiVI:['iii','VI','ii','V','I'],VIiiVI:['VI','ii','V','I']};
function buildSteps(ton,tonic,depth,type,iq,prog){
  const kl=keyLetter(ton,tonic),R=REC[ton],dk=depth==='color'?'co':'sh';
  const list=ton==='maj'?(PROGS[prog]||PROGS.iiVI):PROGS.iiVI;
  return list.map((rname,ix)=>{
    const ro=ROLEDEF[rname];
    const rec=ro.like==='I'?R.I[iq][dk]:R[ro.like][dk];
    const rl=(kl+ro.off)%7,rpc=(tonic+ro.semi)%12;
    let order,sym=rec.sym;
    if(type==='B'&&rec.B){order=rec.B.slice();sym=rec.symB||rec.sym;}
    else{order=rec.A.slice();if(type==='B')order.push(order.shift());}
    const mk=k=>{const d=DEG[k],pc=(rpc+d.s)%12;return{k,deg:d.t,n:d.n,pc,name:spell((rl+d.l)%7,pc)};};
    const shell=order.map(mk),nat=shell.slice().sort((a,b)=>a.n-b.n);
    const offs=[0];for(let i=1;i<shell.length;i++)offs.push(offs[i-1]+((shell[i].pc-shell[i-1].pc+12)%12));
    return{ix,role:rname==='I'&&ton==='min'?'i':rname,cls:ro.cls,rootPc:rpc,rootName:spell(rl,rpc),chord:spell(rl,rpc)+sym,shell,nat,offs,need:shell,done:false,rev:false,vl:'',pos:[]};
  });
}
/* voice-leading */
const cd=(a,b)=>{const x=((b-a)%12+12)%12;return x>6?12-x:x;};
const sd=(a,b)=>((((b-a)%12)+12+6)%12)-6;
function vlCost(p,n){
  const m=p.length,k=n.length;

/* ---------- audio analysis: polyphonic note finder ---------- */
function makeFFT(N){
  const rev=new Uint32Array(N),cs=new Float32Array(N/2),sn=new Float32Array(N/2),bits=Math.log2(N);
  for(let i=0;i<N;i++){let x=i,r=0;for(let b=0;b<bits;b++){r=(r<<1)|(x&1);x>>=1;}rev[i]=r;}
  for(let i=0;i<N/2;i++){cs[i]=Math.cos(2*Math.PI*i/N);sn[i]=-Math.sin(2*Math.PI*i/N);}
  return function(re,im){
    for(let i=0;i<N;i++){const j=rev[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t;}}
    for(let size=2;size<=N;size<<=1){
      const half=size>>1,step=N/size;
      for(let i=0;i<N;i+=size)for(let j=0,k=0;j<half;j++,k+=step){
        const a=i+j,b=a+half,tr=re[b]*cs[k]-im[b]*sn[k],ti=re[b]*sn[k]+im[b]*cs[k];
        re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;
      }
    }
  };
}
const DN=16384;let _fft=null,_win=null;
function spectrum(x){

}
const AL=[1,.8,.65,.5,.42,.35,.3,.25],WH=[1,.9,.8,.7,.6,.5,.4,.35];
function peakAt(R,f,bh,sw){
  const lo=Math.max(1,Math.floor(f*Math.pow(2,-sw/12)/bh)),hi=Math.min(R.length-2,Math.ceil(f*Math.pow(2,sw/12)/bh));

}
function sal(R,f0,bh){let s=0;for(let h=1;h<=8;h++){const f=f0*h;if(f>5000)break;s+=WH[h-1]*peakAt(R,f,bh,.4);}return s;}

  for(let it=0;it<(maxN||4);it++){
    let bm=-1,bs=0;
    for(let m=40;m<=88;m++){const s=sal(R,a4*Math.pow(2,(m-69)/12),bh);if(s>bs){bs=s;bm=m;}}

function voicingScore(R,sr,a4,offs,pcLow){
  const bh=sr/DN,tot=offs[offs.length-1];let best=0;

    endCard(ok,ms,ok?450:700);
  }else{FX.ok();render();announceStep();}
}
function wrong(st,pre){
  const c=S.card;c.missed=true;FX.bad();
  if(cfg.onMiss==='retry'){S.buf=[];render();bump(S.si);msg('✗ '+(pre||'Try again'),'bad');return;}
  S.lock=true;reveal(st);render();bump(S.si);
  msg(`✗ ${pre?pre+': ':''}${st.chord} → ${ansText(st)}`,'bad');
  endCard(false,0,1800);
}
function bump(i){const t=$$('#tiles .tile')[i];if(!t)return;t.classList.add('bad');setTimeout(()=>t.classList.remove('bad'),400);}
function timeout(){
  if(S.lock||!S.card)return;
  const c=S.card,st=c.steps[S.si];c.missed=true;S.lock=true;FX.bad();reveal(st);render();
  msg(`⏱ ${st.chord} → ${ansText(st)}`,'bad');endCard(false,0,1600);
}
function endCard(ok,ms,delay){
  const c=S.card;S.lock=true;S.prev=c;
  const hk=c.ton+c.tonic,h=hist[hk]||(hist[hk]={n:0,m:0,ok:0,t:0});h.n++;
  if(ok){h.ok++;h.t+=ms;stats.ok++;stats.streak++;stats.best=Math.max(stats.best,stats.streak);stats.times.push(ms);}
  else{h.m++;stats.miss++;stats.streak=0;const k=c.ton+':'+c.tonic;stats.keyMiss[k]=(stats.keyMiss[k]||0)+1;}
  hdr();save();
  if(ok&&cfg.echo&&cfg.timer==='off'&&!MIC.on){playProg(c,1.1);delay=Math.max(delay,3600);}
  clearTimeout(S.nt);S.nt=setTimeout(()=>{if(S.running)newCard();},delay);
}

/* ---------- learn mode ---------- */
function learnStart(){S.lh=[];S.hi=-1;resetSeq();S.running=false;S.lock=false;learnGo(1);}
function learnGo(d){
  if(d<0){if(S.hi>0)S.hi--;}
  else if(S.hi<S.lh.length-1)S.hi++;
  else{
    const c=makeCard(S.lh[S.lh.length-1]||null);c.steps.forEach(s=>{s.rev=true;});
    S.lh.push(c);if(S.lh.length>60)S.lh.shift();S.hi=S.lh.length-1;
  }
  S.card=S.lh[S.hi];learnSel(0,false);
}
function learnSel(i,snd){
  const c=S.card;if(!c)return;
  S.si=i;const st=c.steps[i];clearAns();st.pos.forEach(m=>flash(m,'ans',0));render();
  msg(`${st.chord}  ·  ${st.shell.map(n=>n.name).join(' ')}${st.vl?'  ·  from prev: '+st.vl:''}`);
  $('#bSkip').disabled=S.hi<=0;
  if(snd)playStep(st,0);
}

/* ---------- session ---------- */
async function getWL(){try{if('wakeLock' in navigator)S.wl=await navigator.wakeLock.request('screen');}catch(e){}}
function releaseWL(){try{S.wl&&S.wl.release();}catch(e){}S.wl=null;}
function start(){
  ac();FX.start();resetStats();
  S.running=true;resetSeq();S.t0=performance.now();S.lastSec=-1;
  S.end=cfg.timer==='session'?S.t0+cfg.sessLen*1000:0;
  try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});}catch(e){}
  getWL();hdr();ui();newCard();
}
function finish(timeUp){
  if(!S.running)return;
  S.running=false;S.lock=true;clearTimeout(S.nt);releaseWL();
  try{speechSynthesis.cancel();}catch(e){}
  const dur=(performance.now()-S.t0)/1000,n=stats.ok+stats.miss,t=stats.times;
  const res={ok:stats.ok,miss:stats.miss,n,acc:n?Math.round(stats.ok/n*100):0,avg:t.length?t.reduce((a,b)=>a+b,0)/t.length/1000:0,fast:t.length?Math.min(...t)/1000:0,streak:stats.best,cpm:dur>0?stats.ok/(dur/60):0,dur,weak:Object.entries(stats.keyMiss).sort((a,b)=>b[1]-a[1]).slice(0,5)};
  timeUp?FX.end():FX.stop();
  S.card=null;clearAns();ui();
  if(n>0){res.nb=recordBest(res);if(res.nb)setTimeout(FX.best,800);showRes(res);}
}
const bestKey=()=>cfg.mode+'|'+cfg.ton+'|'+cfg.depth+'|'+cfg.timer+'|'+(cfg.timer==='session'?cfg.sessLen:cfg.timer==='card'?cfg.cardLen:0);
function recordBest(r){
  const k=bestKey(),p=bests[k];let nb=false;
  if(cfg.timer==='session'){if(r.ok>0&&(!p||r.ok>p.ok)){bests[k]={ok:r.ok};nb=true;}}
  else if(r.ok>=5&&(!p||r.avg<p.avg)){bests[k]={avg:r.avg,ok:r.ok};nb=true;}
  save();return nb;
}
const keyLabel=k=>{const[t,p]=k.split(':');return NAMES[t][+p]+(t==='min'?'m':'');};

/* ---------- render ---------- */
function msg(t,c){const m=$('#msg');m.textContent=t;m.className=c||'';}
function hdr(){$('#sOk').textContent='✓ '+stats.ok;$('#sBad').textContent='✗ '+stats.miss;$('#sStr').textContent='🔥 '+stats.streak;}
function tileHTML(st,i){
  const L=cfg.mode==='learn';
  const act=L?i===S.si:(S.running&&i===S.si&&!S.lock);
  const disp=cfg.mode==='recall'?st.nat:st.shell,showDeg=cfg.mode==='recall'||cfg.hints;
  const slots=disp.map(n=>{
    const asked=st.need.includes(n);
    if(!asked)return'<div class="slot na"><b>·</b></div>';
    if(L)return`<div class="slot ${act?'ok':'rev'}"><b>${n.name}</b></div>`;
    if(st.done||(i===S.si&&S.buf.some(m=>m%12===n.pc)))return`<div class="slot ok"><b>${n.name}</b></div>`;
    if(st.rev)return`<div class="slot rev"><b>${n.name}</b></div>`;
    return`<div class="slot"><b>?</b>${showDeg?`<small>${n.deg}</small>`:''}</div>`;
  }).join('');
  const showVl=(L||st.done||st.rev)&&st.vl;
  return`<div class="tile ${st.cls}${act?' act':''}${st.done?' done':''}" data-i="${i}"><div class="role">${st.role}</div><div class="chord">${st.chord}</div><div class="slots">${slots}</div><div class="vl">${showVl?st.vl:''}</div></div>`;
}
function render(){
  const c=S.card,L=cfg.mode==='learn';

  if(!S.card)return;ac();playStep(S.card.steps[Math.min(S.si,S.card.steps.length-1)],0);
};
$('#bShow').onclick=()=>{
  if(cfg.mode==='learn'){playProg(S.card);return;}
  if(!S.running||S.lock)return;FX.show();
  const c=S.card,st=c.steps[S.si];c.missed=true;S.lock=true;reveal(st);render();
  msg(`${st.chord} → ${ansText(st)}`,'');endCard(false,0,2000);
};
$('#bSkip').onclick=()=>{
  if(cfg.mode==='learn'){FX.tick();learnGo(-1);return;}
  if(!S.running)return;FX.skip();clearTimeout(S.nt);S.prev=S.card;newCard();
};
$('#bStop').onclick=()=>{
  if(cfg.mode==='learn'){FX.tick();learnGo(1);return;}
  finish(false);
};
$('#tiles').addEventListener('click',e=>{
  if(cfg.mode!=='learn')return;
  const t=e.target.closest('.tile');if(t)learnSel(+t.dataset.i,true);
});
$('#bGear').onclick=openSheet;
$('#bClose').onclick=closeSheet;
$$('#modeSeg button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.addEventListener('pointerdown',e=>{
  ac();
  const b=e.target.closest('button');
  if(b&&!b.hasAttribute('data-nofx')&&!b.disabled)FX.tick();
},true);

/* ---------- MIDI ---------- */

/* ---------- microphone ---------- */
const nName=m=>['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'][m%12]+(Math.floor(m/12)-1);
async function micStart(){
  if(MIC.on){micStop();return;}
  const c=ac();
  if(!c||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Microphone not available here');return;}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    MIC.stream=st;MIC.src=c.createMediaStreamSource(st);
    MIC.an=c.createAnalyser();MIC.an.fftSize=32768;MIC.an.smoothingTimeConstant=0;
    MIC.src.connect(MIC.an);
    MIC.buf=new Float32Array(MIC.an.fftSize);MIC.sr=c.sampleRate;MIC.rms=[];MIC.at=0;MIC.last=0;
    MIC.on=true;MIC.timer=setInterval(micTick,20);
    $('#bMic').classList.add('on');$('#heard').style.display='block';$('#heard').textContent='listening';
    toast('Mic on: play the shells on your piano');
  }catch(e){toast('Microphone blocked');}
}
function micStop(){
  MIC.on=false;clearInterval(MIC.timer);
  try{MIC.src&&MIC.src.disconnect();MIC.stream&&MIC.stream.getTracks().forEach(t=>t.stop());}catch(e){}
  const b=$('#bMic');b.classList.remove('on');b.style.removeProperty('--lv');$('#heard').style.display='none';
}
function micTick(){
  if(!MIC.on)return;
  const b=MIC.buf;MIC.an.getFloatTimeDomainData(b);
  const n=b.length,W=Math.round(MIC.sr*.02);let s=0;for(let i=n-W;i<n;i++)s+=b[i]*b[i];
  const r=Math.sqrt(s/W),h=MIC.rms;h.push(r);if(h.length>8)h.shift();
  $('#bMic').style.setProperty('--lv',Math.min(100,r*900)+'%');
  const now=performance.now(),fl={low:.008,mid:.003,high:.0015,max:.0007}[cfg.micSens]||.003;
  if(!MIC.at&&h.length>=4&&now>MIC.deaf&&now-MIC.last>380&&r>fl&&r>1.5*h[h.length-3]&&r>1.15*h[h.length-2]){MIC.t0=now;MIC.last=now;MIC.at=now+260;}
  if(MIC.at&&now>=MIC.at){MIC.at=0;micHear();}
}
function micHear(){
  if(MIC.deaf>MIC.t0-80)return;
  const E=(S.running&&!S.lock&&S.card&&S.card.steps[S.si])?S.card.steps[S.si].need.map(n=>n.pc):[];
  const an=micAnalyze(MIC.buf,MIC.sr,cfg.a4||440),sel=micDecide(an,E);
  const hd=$('#heard');hd.textContent=sel.length?sel.map(x=>nName(x.m)).join(' '):'–';
  clearTimeout(MIC.hideT);MIC.hideT=setTimeout(()=>{if(MIC.on)hd.textContent='listening';},3000);
  if(E.length&&sel.length)micApply(sel,E,an.post);
}
function micApply(sel,E,spec){
  const c=S.card,st=c.steps[S.si];
  const extras=sel.filter(x=>x.src==='n'&&!E.includes(x.m%12)&&x.s>=.45);
  for(const x of sel)if(E.includes(x.m%12)&&!S.buf.some(b=>b%12===x.m%12)){flash(x.m,'good',260);S.buf.push(x.m);}
  render();
  if(extras.length){flash(extras[0].m,'bad',500);return wrong(st,'');}
  if(S.buf.length<E.length)return;
  if(cfg.mode==='play'&&cfg.micVoicing){
    let ok;
    if(spec){
      const alt=buildSteps(c.ton,c.tonic,c.depth,c.type==='A'?'B':'A',c.iq)[S.si];
      ok=voicingIsCurrent(spec,MIC.sr,cfg.a4||440,st,alt);
    }else ok=Math.min(...S.buf)%12===st.shell[0].pc;
    if(!ok)return wrong(st,'Voicing');
  }
  stepDone();
}
$('#bMic').onclick=micStart;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200);}
$('#bMidi').onclick=async()=>{
  if(!navigator.requestMIDIAccess){toast('MIDI not supported in this browser');return;}
  try{
    const a=await navigator.requestMIDIAccess();
    const bind=()=>{a.inputs.forEach(i=>{i.onmidimessage=ev=>{const[s,n,v]=ev.data;if((s&0xf0)===0x90&&v>0)noteOn(n);};});};
    bind();a.onstatechange=bind;
    $('#bMidi').classList.add('on');
    toast(a.inputs.size?'MIDI keyboard connected':'MIDI ready – plug in a keyboard');
  }catch(e){toast('MIDI access blocked');}
};

/* ---------- clock ---------- */
setInterval(()=>{
  if(!S.running)return;
  const now=performance.now(),ck=$('#clock');
  if(cfg.timer==='session'){
    const rem=S.end-now;ck.textContent=fmt(rem/1000);
    const sec=Math.ceil(rem/1000);
    if(sec!==S.lastSec){S.lastSec=sec;if(sec<=5&&sec>0)FX.tm(sec<=3);}
    ck.classList.toggle('warn',rem<=10000);
    if(rem<=0)return finish(true);
  }else if(cfg.timer==='card'&&S.card){
    const left=cfg.cardLen*1000-(now-S.card.t0);
    if(!S.lock){
      ck.textContent=Math.max(0,left/1000).toFixed(1)+'s';ck.classList.toggle('warn',left<=2000);
      const i=$('#tbar i'),p=Math.max(0,left/(cfg.cardLen*1000));
      i.style.width=p*100+'%';i.style.background=p>.5?'var(--green)':p>.25?'var(--amber)':'var(--red)';
      if(left<=0)timeout();
    }
  }else{ck.textContent=fmt((now-S.t0)/1000);}
},100);

document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.running)getWL();});
/* ---------- init ---------- */
buildKB();
if(cfg.mode==='learn')learnStart();
ui();hdr();
window.__shellDrill={voicingIsCurrent,S,cfg,noteOn,buildSteps,vlCost,pickType,voicingOK,layout,micApply,micDecide,micAnalyze,detect,spectrum,resetSeq,makeCard};
})();
</script>
